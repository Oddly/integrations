---
description: Pipeline for node_exporter disk I/O metrics (use_types + rate_counters)
processors:
  - set:
      tag: set_event_ingested
      field: event.ingested
      value: "{{_ingest.timestamp}}"
  - set:
      tag: set_event_kind
      field: event.kind
      value: metric
  - set:
      tag: set_event_module
      field: event.module
      value: prometheus_node_exporter
  - set:
      tag: set_event_dataset
      field: event.dataset
      value: prometheus_node_exporter.diskstats

  # Map prometheus.labels to ECS fields
  - set:
      tag: set_service_address
      if: ctx.prometheus?.labels?.instance != null
      field: service.address
      copy_from: prometheus.labels.instance
      override: true
  - remove:
      tag: remove_instance_label
      field: prometheus.labels.instance
      ignore_missing: true
  - set:
      tag: set_service_name
      if: ctx.prometheus?.labels?.job != null
      field: service.name
      copy_from: prometheus.labels.job
      override: true
  - remove:
      tag: remove_job_label
      field: prometheus.labels.job
      ignore_missing: true

  # Extract device label to raw namespace
  - set:
      tag: set_node_diskio_name
      if: ctx.prometheus?.labels?.device != null
      field: node_exporter.diskio.name
      copy_from: prometheus.labels.device

  # Call ECS sub-pipeline (reads prometheus.* counters + rates)
  - pipeline:
      name: '{{ IngestPipeline "ecs" }}'
      tag: pipeline_ecs

  # Call OTel sub-pipeline (reads prometheus.* counters)
  - pipeline:
      name: '{{ IngestPipeline "otel" }}'
      tag: pipeline_otel

  # Remove device label
  - remove:
      tag: remove_device_label
      field: prometheus.labels.device
      ignore_missing: true

  # --- Rename counter fields to node_exporter.diskio.* (raw data) ---
  - rename:
      tag: rename_node_reads_completed
      field: prometheus.node_disk_reads_completed_total.counter
      target_field: node_exporter.diskio.read.count
      ignore_missing: true
  - rename:
      tag: rename_node_writes_completed
      field: prometheus.node_disk_writes_completed_total.counter
      target_field: node_exporter.diskio.write.count
      ignore_missing: true
  - rename:
      tag: rename_node_read_bytes
      field: prometheus.node_disk_read_bytes_total.counter
      target_field: node_exporter.diskio.read.bytes
      ignore_missing: true
  - rename:
      tag: rename_node_written_bytes
      field: prometheus.node_disk_written_bytes_total.counter
      target_field: node_exporter.diskio.write.bytes
      ignore_missing: true
  - rename:
      tag: rename_node_read_time
      field: prometheus.node_disk_read_time_seconds_total.counter
      target_field: node_exporter.diskio.read.time_seconds
      ignore_missing: true
  - rename:
      tag: rename_node_write_time
      field: prometheus.node_disk_write_time_seconds_total.counter
      target_field: node_exporter.diskio.write.time_seconds
      ignore_missing: true
  - rename:
      tag: rename_node_io_time
      field: prometheus.node_disk_io_time_seconds_total.counter
      target_field: node_exporter.diskio.io.time_seconds
      ignore_missing: true

  # Drop remaining prometheus metric fields (use_types puts them at prometheus.<metric>)
  - remove:
      tag: remove_prometheus_metrics
      field:
        - prometheus.node_disk_reads_completed_total
        - prometheus.node_disk_writes_completed_total
        - prometheus.node_disk_read_bytes_total
        - prometheus.node_disk_written_bytes_total
        - prometheus.node_disk_read_time_seconds_total
        - prometheus.node_disk_write_time_seconds_total
        - prometheus.node_disk_io_time_seconds_total
      ignore_missing: true

on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: "Processor {{ _ingest.on_failure_processor_type }} with tag {{ _ingest.on_failure_processor_tag }} failed with message {{ _ingest.on_failure_message }}"
