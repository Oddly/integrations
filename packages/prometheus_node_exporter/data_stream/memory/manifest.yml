title: Node Exporter memory metrics
type: metrics
streams:
  - input: prometheus/metrics
    vars:
      - name: period
        type: text
        title: Period
        required: true
        show_user: true
        default: 60s
      - name: tags
        type: text
        title: Tags
        multi: true
        required: false
        show_user: false
        default:
          - prometheus-node-exporter-memory
      - name: processors
        type: yaml
        title: Processors
        required: false
        show_user: false
    title: Node Exporter memory metrics
    description: Collect system memory metrics from node_exporter
elasticsearch:
  index_mode: time_series
