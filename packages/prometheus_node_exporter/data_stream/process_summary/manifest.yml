title: Node Exporter process summary
type: metrics
streams:
  - input: prometheus/metrics
    vars:
      - name: period
        type: text
        title: Period
        required: true
        show_user: true
        default: 10s
      - name: tags
        type: text
        title: Tags
        multi: true
        required: false
        show_user: false
        default:
          - prometheus-node-exporter-process-summary
      - name: processors
        type: yaml
        title: Processors
        required: false
        show_user: false
    title: Node Exporter process summary
    description: Collect process summary metrics from node_exporter
elasticsearch:
  index_mode: time_series
