---
description: Pipeline for node_exporter network metrics
processors:
  - set:
      tag: set_event_ingested
      field: event.ingested
      value: "{{_ingest.timestamp}}"
  - set:
      tag: set_event_kind
      field: event.kind
      value: metric
  - set:
      tag: set_event_module
      field: event.module
      value: prometheus_node_exporter
  - set:
      tag: set_event_dataset
      field: event.dataset
      value: prometheus_node_exporter.network

  # Map prometheus.labels to ECS fields
  - set:
      tag: set_service_address
      if: ctx.prometheus?.labels?.instance != null
      field: service.address
      copy_from: prometheus.labels.instance
      override: true
  - remove:
      tag: remove_instance_label
      field: prometheus.labels.instance
      ignore_missing: true
  - set:
      tag: set_service_name
      if: ctx.prometheus?.labels?.job != null
      field: service.name
      copy_from: prometheus.labels.job
      override: true
  - remove:
      tag: remove_job_label
      field: prometheus.labels.job
      ignore_missing: true

  # Rename device label to node.* + system.* dimensions
  - set:
      tag: set_node_network_name
      if: ctx.prometheus?.labels?.device != null
      field: node_exporter.network.name
      copy_from: prometheus.labels.device
  - set:
      tag: set_network_name
      if: ctx.prometheus?.labels?.device != null
      field: system.network.name
      copy_from: prometheus.labels.device
      override: true
  - remove:
      tag: remove_device_label
      field: prometheus.labels.device
      ignore_missing: true

  # --- Network fields: node.* (native) + system.* (System integration compat) ---
  - set:
      tag: set_node_receive_bytes
      if: ctx.prometheus?.metrics?.node_network_receive_bytes_total != null
      field: node_exporter.network.in.bytes
      copy_from: prometheus.metrics.node_network_receive_bytes_total
  - rename:
      tag: rename_receive_bytes
      field: prometheus.metrics.node_network_receive_bytes_total
      target_field: system.network.in.bytes
      ignore_missing: true
  - set:
      tag: set_node_transmit_bytes
      if: ctx.prometheus?.metrics?.node_network_transmit_bytes_total != null
      field: node_exporter.network.out.bytes
      copy_from: prometheus.metrics.node_network_transmit_bytes_total
  - rename:
      tag: rename_transmit_bytes
      field: prometheus.metrics.node_network_transmit_bytes_total
      target_field: system.network.out.bytes
      ignore_missing: true
  - set:
      tag: set_node_receive_packets
      if: ctx.prometheus?.metrics?.node_network_receive_packets_total != null
      field: node_exporter.network.in.packets
      copy_from: prometheus.metrics.node_network_receive_packets_total
  - rename:
      tag: rename_receive_packets
      field: prometheus.metrics.node_network_receive_packets_total
      target_field: system.network.in.packets
      ignore_missing: true
  - set:
      tag: set_node_transmit_packets
      if: ctx.prometheus?.metrics?.node_network_transmit_packets_total != null
      field: node_exporter.network.out.packets
      copy_from: prometheus.metrics.node_network_transmit_packets_total
  - rename:
      tag: rename_transmit_packets
      field: prometheus.metrics.node_network_transmit_packets_total
      target_field: system.network.out.packets
      ignore_missing: true
  - set:
      tag: set_node_receive_errs
      if: ctx.prometheus?.metrics?.node_network_receive_errs_total != null
      field: node_exporter.network.in.errors
      copy_from: prometheus.metrics.node_network_receive_errs_total
  - rename:
      tag: rename_receive_errs
      field: prometheus.metrics.node_network_receive_errs_total
      target_field: system.network.in.errors
      ignore_missing: true
  - set:
      tag: set_node_transmit_errs
      if: ctx.prometheus?.metrics?.node_network_transmit_errs_total != null
      field: node_exporter.network.out.errors
      copy_from: prometheus.metrics.node_network_transmit_errs_total
  - rename:
      tag: rename_transmit_errs
      field: prometheus.metrics.node_network_transmit_errs_total
      target_field: system.network.out.errors
      ignore_missing: true
  - set:
      tag: set_node_receive_drop
      if: ctx.prometheus?.metrics?.node_network_receive_drop_total != null
      field: node_exporter.network.in.dropped
      copy_from: prometheus.metrics.node_network_receive_drop_total
  - rename:
      tag: rename_receive_drop
      field: prometheus.metrics.node_network_receive_drop_total
      target_field: system.network.in.dropped
      ignore_missing: true
  - set:
      tag: set_node_transmit_drop
      if: ctx.prometheus?.metrics?.node_network_transmit_drop_total != null
      field: node_exporter.network.out.dropped
      copy_from: prometheus.metrics.node_network_transmit_drop_total
  - rename:
      tag: rename_transmit_drop
      field: prometheus.metrics.node_network_transmit_drop_total
      target_field: system.network.out.dropped
      ignore_missing: true

  # Drop remaining prometheus metrics
  - remove:
      tag: remove_prometheus_metrics
      field: prometheus.metrics
      ignore_missing: true

on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: "Processor {{ _ingest.on_failure_processor_type }} with tag {{ _ingest.on_failure_processor_tag }} failed with message {{ _ingest.on_failure_message }}"
