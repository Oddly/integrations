---
description: Pipeline for node_exporter CPU metrics
processors:
  - set:
      tag: set_event_ingested
      field: event.ingested
      value: "{{_ingest.timestamp}}"
  - set:
      tag: set_event_kind
      field: event.kind
      value: metric
  - set:
      tag: set_event_module
      field: event.module
      value: prometheus_node_exporter
  - set:
      tag: set_event_dataset
      field: event.dataset
      value: prometheus_node_exporter.cpu

  # Map prometheus.labels to ECS fields
  - set:
      tag: set_service_address
      if: ctx.prometheus?.labels?.instance != null
      field: service.address
      copy_from: prometheus.labels.instance
      override: true
  - remove:
      tag: remove_instance_label
      field: prometheus.labels.instance
      ignore_missing: true
  - set:
      tag: set_service_name
      if: ctx.prometheus?.labels?.job != null
      field: service.name
      copy_from: prometheus.labels.job
      override: true
  - remove:
      tag: remove_job_label
      field: prometheus.labels.job
      ignore_missing: true

  # Rename collector-specific labels to named dimension fields
  - set:
      tag: set_cpu_id
      if: ctx.prometheus?.labels?.cpu != null
      field: node_exporter.cpu.id
      copy_from: prometheus.labels.cpu
      override: true
  - remove:
      tag: remove_cpu_label
      field: prometheus.labels.cpu
      ignore_missing: true
  - set:
      tag: set_cpu_mode
      if: ctx.prometheus?.labels?.mode != null
      field: node_exporter.cpu.mode
      copy_from: prometheus.labels.mode
      override: true
  - remove:
      tag: remove_mode_label
      field: prometheus.labels.mode
      ignore_missing: true

  # Rename CPU metrics
  - rename:
      tag: rename_cpu_seconds_total
      field: prometheus.metrics.node_cpu_seconds_total
      target_field: node_exporter.cpu.seconds.total
      ignore_missing: true
  - rename:
      tag: rename_cpu_guest_seconds_total
      field: prometheus.metrics.node_cpu_guest_seconds_total
      target_field: node_exporter.cpu.guest_seconds.total
      ignore_missing: true

  # Drop remaining prometheus metrics
  - remove:
      tag: remove_prometheus_metrics
      field: prometheus.metrics
      ignore_missing: true

on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: "Processor {{ _ingest.on_failure_processor_type }} with tag {{ _ingest.on_failure_processor_tag }} failed with message {{ _ingest.on_failure_message }}"
