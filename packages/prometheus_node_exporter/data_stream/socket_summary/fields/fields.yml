- name: prometheus
  type: group
  fields:
    - name: labels.*
      type: keyword
      dimension: true
      description: Prometheus metric labels.
- name: system
  type: group
  fields:
    - name: socket.summary.all.count
      type: long
      metric_type: gauge
      description: Total number of TCP and UDP sockets.
    - name: socket.summary.tcp.all.count
      type: long
      metric_type: gauge
      description: Total number of TCP sockets (IPv4 inuse + IPv6 inuse + TIME_WAIT).
    - name: socket.summary.tcp.all.established
      type: long
      metric_type: gauge
      description: Number of established TCP connections.
    - name: socket.summary.tcp.all.time_wait
      type: long
      metric_type: gauge
      description: Number of TCP connections in TIME_WAIT state.
    - name: socket.summary.tcp.all.orphan
      type: long
      metric_type: gauge
      description: Number of orphaned TCP connections.
    - name: socket.summary.tcp.memory
      type: long
      metric_type: gauge
      unit: byte
      description: Memory used by TCP sockets in bytes.
    - name: socket.summary.udp.all.count
      type: long
      metric_type: gauge
      description: Total number of UDP sockets (IPv4 inuse + IPv6 inuse).
    - name: socket.summary.udp.memory
      type: long
      metric_type: gauge
      unit: byte
      description: Memory used by UDP sockets in bytes.
# --- OTel system metrics semantic convention fields ---
- name: system.network.connection.count
  type: group
  fields:
    - name: tcp.established
      type: long
      metric_type: gauge
      description: Established TCP connections (OTel system.network.connections state=established).
    - name: tcp.time_wait
      type: long
      metric_type: gauge
      description: TCP connections in TIME_WAIT state (OTel system.network.connections state=time_wait).
- name: node_exporter
  type: group
  fields:
    - name: socket.tcp.alloc
      type: long
      metric_type: gauge
      description: Total allocated TCP sockets (from /proc/net/sockstat TCP alloc).
    - name: socket.tcp.inuse
      type: long
      metric_type: gauge
      description: Number of IPv4 TCP sockets in use (excludes LISTEN and TIME_WAIT).
    - name: socket.all.used
      type: long
      metric_type: gauge
      description: Total sockets in use across all protocols (from /proc/net/sockstat).
