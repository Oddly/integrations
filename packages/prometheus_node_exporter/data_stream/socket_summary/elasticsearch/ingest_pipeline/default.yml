---
description: Pipeline for node_exporter socket summary metrics
processors:
  - set:
      tag: set_event_ingested
      field: event.ingested
      value: "{{_ingest.timestamp}}"
  - set:
      tag: set_event_kind
      field: event.kind
      value: metric
  - set:
      tag: set_event_module
      field: event.module
      value: prometheus_node_exporter
  - set:
      tag: set_event_dataset
      field: event.dataset
      value: prometheus_node_exporter.socket_summary

  # Map prometheus.labels to ECS fields
  - set:
      tag: set_service_address
      if: ctx.prometheus?.labels?.instance != null
      field: service.address
      copy_from: prometheus.labels.instance
      override: true
  - remove:
      tag: remove_instance_label
      field: prometheus.labels.instance
      ignore_missing: true
  - set:
      tag: set_service_name
      if: ctx.prometheus?.labels?.job != null
      field: service.name
      copy_from: prometheus.labels.job
      override: true
  - remove:
      tag: remove_job_label
      field: prometheus.labels.job
      ignore_missing: true

  # Extract node_exporter-specific fields to raw namespace
  - set:
      tag: set_sockets_used
      if: ctx.prometheus?.metrics?.node_sockstat_sockets_used != null
      field: node_exporter.socket.all.used
      copy_from: prometheus.metrics.node_sockstat_sockets_used
  - set:
      tag: set_tcp_alloc
      if: ctx.prometheus?.metrics?.node_sockstat_TCP_alloc != null
      field: node_exporter.socket.tcp.alloc
      copy_from: prometheus.metrics.node_sockstat_TCP_alloc
  - set:
      tag: set_tcp_inuse
      if: ctx.prometheus?.metrics?.node_sockstat_TCP_inuse != null
      field: node_exporter.socket.tcp.inuse
      copy_from: prometheus.metrics.node_sockstat_TCP_inuse

  # Call ECS sub-pipeline
  - pipeline:
      name: '{{ IngestPipeline "ecs" }}'
      tag: pipeline_ecs

  # Call OTel sub-pipeline
  - pipeline:
      name: '{{ IngestPipeline "otel" }}'
      tag: pipeline_otel

  # Drop remaining prometheus metrics
  - remove:
      tag: remove_prometheus_metrics
      field: prometheus.metrics
      ignore_missing: true

on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: "Processor {{ _ingest.on_failure_processor_type }} with tag {{ _ingest.on_failure_processor_tag }} failed with message {{ _ingest.on_failure_message }}"
