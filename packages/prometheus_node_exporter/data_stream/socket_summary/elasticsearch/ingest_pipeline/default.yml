---
description: Pipeline for node_exporter socket summary metrics
processors:
  - set:
      tag: set_event_ingested
      field: event.ingested
      value: "{{_ingest.timestamp}}"
  - set:
      tag: set_event_kind
      field: event.kind
      value: metric
  - set:
      tag: set_event_module
      field: event.module
      value: prometheus_node_exporter
  - set:
      tag: set_event_dataset
      field: event.dataset
      value: prometheus_node_exporter.socket_summary

  # Map prometheus.labels to ECS fields
  - set:
      tag: set_service_address
      if: ctx.prometheus?.labels?.instance != null
      field: service.address
      copy_from: prometheus.labels.instance
      override: true
  - remove:
      tag: remove_instance_label
      field: prometheus.labels.instance
      ignore_missing: true
  - set:
      tag: set_service_name
      if: ctx.prometheus?.labels?.job != null
      field: service.name
      copy_from: prometheus.labels.job
      override: true
  - remove:
      tag: remove_job_label
      field: prometheus.labels.job
      ignore_missing: true

  # --- Socket summary fields ---

  # Extra node_exporter fields (not in system integration)
  - rename:
      tag: rename_sockets_used
      field: prometheus.metrics.node_sockstat_sockets_used
      target_field: node_exporter.socket.all.used
      ignore_missing: true
  - rename:
      tag: rename_tcp_alloc
      field: prometheus.metrics.node_sockstat_TCP_alloc
      target_field: node_exporter.socket.tcp.alloc
      ignore_missing: true
  - rename:
      tag: rename_tcp_inuse
      field: prometheus.metrics.node_sockstat_TCP_inuse
      target_field: node_exporter.socket.tcp.inuse
      ignore_missing: true

  # Direct 1:1 mappings to system.socket.summary.*
  - rename:
      tag: rename_tcp_established
      field: prometheus.metrics.node_netstat_Tcp_CurrEstab
      target_field: system.socket.summary.tcp.all.established
      ignore_missing: true
  - rename:
      tag: rename_tcp_tw
      field: prometheus.metrics.node_sockstat_TCP_tw
      target_field: system.socket.summary.tcp.all.time_wait
      ignore_missing: true
  - rename:
      tag: rename_tcp_orphan
      field: prometheus.metrics.node_sockstat_TCP_orphan
      target_field: system.socket.summary.tcp.all.orphan
      ignore_missing: true
  - rename:
      tag: rename_tcp_mem
      field: prometheus.metrics.node_sockstat_TCP_mem_bytes
      target_field: system.socket.summary.tcp.memory
      ignore_missing: true
  - rename:
      tag: rename_udp_mem
      field: prometheus.metrics.node_sockstat_UDP_mem_bytes
      target_field: system.socket.summary.udp.memory
      ignore_missing: true

  # Compute tcp.all.count, udp.all.count, all.count from IPv4+IPv6 sockstat values
  - script:
      tag: compute_socket_counts
      lang: painless
      source: >-
        long tcp_inuse = 0;
        long tcp6_inuse = 0;
        long tcp_tw = 0;
        long udp_inuse = 0;
        long udp6_inuse = 0;
        if (ctx.node_exporter?.socket?.tcp?.inuse != null) {
          tcp_inuse = (long)ctx.node_exporter.socket.tcp.inuse;
        }
        if (ctx.prometheus?.metrics?.node_sockstat_TCP6_inuse != null) {
          tcp6_inuse = (long)ctx.prometheus.metrics.node_sockstat_TCP6_inuse;
        }
        if (ctx.system?.socket?.summary?.tcp?.all?.time_wait != null) {
          tcp_tw = (long)ctx.system.socket.summary.tcp.all.time_wait;
        }
        if (ctx.prometheus?.metrics?.node_sockstat_UDP_inuse != null) {
          udp_inuse = (long)ctx.prometheus.metrics.node_sockstat_UDP_inuse;
        }
        if (ctx.prometheus?.metrics?.node_sockstat_UDP6_inuse != null) {
          udp6_inuse = (long)ctx.prometheus.metrics.node_sockstat_UDP6_inuse;
        }
        long tcp_count = tcp_inuse + tcp6_inuse + tcp_tw;
        long udp_count = udp_inuse + udp6_inuse;
        if (ctx.system == null) { ctx.system = new HashMap(); }
        if (ctx.system.socket == null) { ctx.system.put('socket', new HashMap()); }
        if (ctx.system.socket.summary == null) { ctx.system.socket.put('summary', new HashMap()); }
        if (ctx.system.socket.summary.tcp == null) { ctx.system.socket.summary.put('tcp', new HashMap()); }
        if (ctx.system.socket.summary.tcp.all == null) { ctx.system.socket.summary.tcp.put('all', new HashMap()); }
        if (ctx.system.socket.summary.udp == null) { ctx.system.socket.summary.put('udp', new HashMap()); }
        if (ctx.system.socket.summary.udp.all == null) { ctx.system.socket.summary.udp.put('all', new HashMap()); }
        ctx.system.socket.summary.tcp.all.count = tcp_count;
        ctx.system.socket.summary.udp.all.count = udp_count;
        if (ctx.system.socket.summary.containsKey('all') == false) {
          ctx.system.socket.summary.put('all', new HashMap());
        }
        ctx.system.socket.summary.all.count = tcp_count + udp_count;

  # Clean up intermediate prometheus metrics used in script
  - remove:
      tag: remove_udp_inuse
      field: prometheus.metrics.node_sockstat_UDP_inuse
      ignore_missing: true
  - remove:
      tag: remove_tcp6_inuse
      field: prometheus.metrics.node_sockstat_TCP6_inuse
      ignore_missing: true
  - remove:
      tag: remove_udp6_inuse
      field: prometheus.metrics.node_sockstat_UDP6_inuse
      ignore_missing: true

  # Drop remaining prometheus metrics
  - remove:
      tag: remove_prometheus_metrics
      field: prometheus.metrics
      ignore_missing: true

on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: "Processor {{ _ingest.on_failure_processor_type }} with tag {{ _ingest.on_failure_processor_tag }} failed with message {{ _ingest.on_failure_message }}"
