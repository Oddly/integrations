- version: 0.4.2
  changes:
    - description: Refocus cluster overview on node health with CPU/memory time series, promote nodes table, remove guest panels (moved to VMs dashboard).
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: 0.4.1
  changes:
    - description: Fix cluster nodes table by normalizing node name field in cluster ingest pipeline.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: 0.4.0
  changes:
    - description: Auto-discover node name from /cluster/status API, removing the node_name configuration variable.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
    - description: Add cluster name dropdown to all dashboards and node list table to cluster overview.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
    - description: Add optional cluster_name variable to tag log data streams with the cluster name for cross-stream filtering.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: 0.3.1
  changes:
    - description: Inject cluster name into all cluster metrics events via CEL program for cluster-level filtering.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: 0.3.0
  changes:
    - description: Restructure dashboards to separate cluster overview from per-node views. Add dedicated Node and Firewall dashboards.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
    - description: Change VMs dashboard filter from agent.name to proxmox.cluster.resource.node for proper per-node guest filtering.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
    - description: Remove firewall panels from Security dashboard into dedicated Firewall dashboard.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: 0.2.0
  changes:
    - description: Add custom CA certificate support for self-signed Proxmox server certificates.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
    - description: Add journald field declarations for auth and cluster_logs data streams.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
    - description: Use official Proxmox logo.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
- version: 0.1.1
  changes:
    - description: Fix CEL state forwarding so API credentials persist across evaluation cycles.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1
- version: 0.1.0
  changes:
    - description: Initial release with cluster and node metrics, access logs, firewall logs, auth events, cluster logs, and task history.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1
